name: Plugin asset/readme update

# Pushes readme.txt and everything under .wordpress-org/ (banners, icons, screenshots) straight to
# the WordPress.org SVN, without touching the plugin code in trunk. It fires on a merge to trunk, so
# the directory listing can be corrected without cutting a release.
#
# This publishes `Stable tag` too, and that one line is the only part of readme.txt that must not come
# from trunk: trunk names the version being developed, and WordPress serves downloads from
# /tags/<stable tag>/, so publishing it pointed the listing at 1.2.0 while only 1.0.0 and 1.1.0 existed
# as tags — the listing resolved to nothing until it was reverted by hand.
#
# So the whole file is taken from trunk and `Stable tag` alone is rewritten to the newest release tag.
# Taking the entire file from the tag instead was the first fix, and it overcorrected: every
# description, tag and screenshot caption then sat unpublishable until the next release, which is the
# opposite of what a workflow that exists to fix a listing without cutting one is for.

on:
  push:
    paths:
      - '.wordpress-org/**'
      - 'readme.txt'
    branches:
      - trunk
  workflow_dispatch:

# Read-only against this repository. The SVN credentials are what grant write, and they go to
# WordPress.org, not to GitHub.
permissions:
  contents: read

# One SVN conversation at a time: two merges in quick succession would otherwise race each other
# against the same working copy. Not cancel-in-progress — an interrupted SVN commit is worse than a
# queued one.
concurrency:
  group: svn-assets
  cancel-in-progress: false

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Tags are needed to find the latest release; a shallow clone has none.
          fetch-depth: 0

      - name: Pin Stable tag to the latest release tag
        run: |
          set -euo pipefail

          TAG="$(git tag --list --sort=-v:refname | head -n1)"

          if [ -z "$TAG" ]; then
            echo "::notice::No release tag yet — nothing to publish, leaving the directory alone."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION="${TAG#v}"
          echo "::notice::Publishing trunk's readme.txt, Stable tag pinned to ${VERSION}"
          sed -i -E "s/^Stable tag:[[:space:]]*.*/Stable tag: ${VERSION}/" readme.txt

          # State it in the log, because a mismatch here is the whole failure mode this guards.
          grep -m1 '^Stable tag:' readme.txt
        id: readme

      - name: WordPress.org plugin asset/readme update
        if: steps.readme.outputs.skip != 'true'
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ vars.SVN_USERNAME }}
          IGNORE_OTHER_FILES: true
